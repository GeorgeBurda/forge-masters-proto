  [12, 12, 11, 10, 9, 8, 6, 5, 2, 3],
  [12, 12, 11, 10, 9, 8, 6, 5, 2, 3],

// Forge Masters — renderer, flows, cheats, test hooks

  for (r = 0; r < R; r++) smithCheer(r, r * 90);
  SFX.fanfare(false);
  FM.bonusShown = { vals: bon.cells.map(function (c) { return c.kind ? c.v : 0; }), forged: bon.forged.slice(), win: shownWin };
  await new Promise(function (res) { endWaiter = res; setTimeout(function () { if (endWaiter === res) { endWaiter = null; res(); } }, 6000); });
  banner = null; bon = null; bonusHeatTarget = 0;
  for (r = 0; r < R; r++) heat[r] = 1; // the field leaves the bonus white-hot and cools down
}
var endWaiter = null;

function verify(o) {
  var gridOk = true;
  for (var r = 0; r < R; r++) for (var y = 0; y < 3; y++) if (shownGrid[r][y] !== o.grid[r][y]) gridOk = false;
  var rec = { n: spinNo, gridOk: gridOk, win: shownWin, want: o.total, winOk: shownWin === o.total, balOk: shownBal === balance, ms: o.msCount, bonus: !!o.bonus };
  if (o.bonus && FM.bonusShown) { var b = FM.bonusShown; rec.bonusOk = b.vals.join() === o.bonus.vals.join() && b.forged.join() === o.bonus.forged.join(); }
  history.push(rec); if (history.length > 5000) history.shift();
  updateDebug('shown', rec);
}

// ---------------- input ----------------
function toLogical(e) { return { x: (e.clientX - OX) / K, y: (e.clientY - OY) / K }; }
function hitSmith(p) {
  for (var i = 0; i < 4; i++) {
    var b = smithBase(i), s = C.smith[i], u = (p.x - (b.x - s.w / 2)) / s.w, v = (p.y - (b.y - s.h)) / s.h;
    if (u < 0 || u >= 1 || v < 0 || v >= 1) continue;
    var mx = Math.floor(u * s.mw), my = Math.floor(v * s.mh);
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) { var xx = mx + dx, yy = my + dy; if (xx >= 0 && yy >= 0 && xx < s.mw && yy < s.mh && s.mask[yy * s.mw + xx]) return i; }
  }
  return -1;
}
function hitFurnace(p) { var f = furnaceC(), dx = (p.x - f.x) / f.rx, dy = (p.y - f.y) / f.ry; return dx * dx + dy * dy <= 1; }
function onTap(e) {
  SFX.unlock();
  if (state === 'load') return;
  if (state === 'spin') { if (!skip) { skip = true; flushWaits(true); skipReels(); } return; }
  if (state === 'present' || state === 'bonus') { skip = true; flushWaits(true); return; }
  if (state === 'bonusEnd') { if (endWaiter) { var w = endWaiter; endWaiter = null; w(); } return; }
  // idle: cheats or spin
  var p = toLogical(e), si = hitSmith(p);
  if (si >= 0) { armedMs[si] ^= 1; SFX.clink(0.5, 1.4); smithCheer(si); updateDebug('armed'); return; }
  if (hitFurnace(p)) { armedBonus ^= 1; SFX.sizzle(0.6); updateDebug('armed'); return; }
  if (balance < BET) balance += 10000; // prototype: auto top-up
  baseSpin();
}
cv.addEventListener('pointerdown', function (e) { e.preventDefault(); onTap(e); });
window.addEventListener('keydown', function (e) { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); onTap({ clientX: -1e4, clientY: -1e4 }); } });
window.addEventListener('resize', function () { if (state !== 'load') layout(); });

// ---------------- debug ----------------
function nm(s) { return Lg.NAMES[s].slice(0, 5); }
function updateDebug(why, rec) {
  if (!DEBUG) return;
  dbgEl.style.display = 'block';
  var o = outcome, s = 'seed ' + SEED + '  spin #' + spinNo + '  fps ' + fps.toFixed(0) + '\narmed: MS[' + armedMs.join('') + '] bonus ' + armedBonus;
  if (o) {
    s += '\n-- pre-decided --\nstops ' + o.stops.join(',') + (o.cheat ? '  (CHEAT)' : '') + '\nMS reels: ' + (o.msCount ? o.ms.map(function (v, i) { return v ? i + 1 : ''; }).join('') : '-');
    for (var y = 0; y < 3; y++) s += '\n' + o.grid.map(function (c) { return (nm(c[y]) + '     ').slice(0, 6); }).join('');
    s += '\nlines ' + o.lineWin + (o.wins.length ? ' (' + o.wins.map(function (w) { return nm(w.sym) + w.len + 'x' + w.ways; }).join(' ') + ')' : '');
    if (o.bonus) { var B = o.bonus; s += '\nBONUS: ' + B.steps.length + ' respins, ingots ' + B.filled + ', forged ' + B.nForged + (B.nForged ? ' ' + B.jpName : '') + '\n vals ' + B.vals.join(',') + '\n bonus win ' + B.win; }
    s += '\nTOTAL ' + o.total;
  }
  if (rec) s += '\n-- shown -- grid ' + (rec.gridOk ? 'OK' : 'MISMATCH') + ' win ' + rec.win + (rec.winOk ? ' OK' : ' MISMATCH') + (rec.bonusOk != null ? ' bonus ' + (rec.bonusOk ? 'OK' : 'MISMATCH') : '');
  dbgEl.textContent = s;
}
setInterval(function () { if (DEBUG && state === 'idle') updateDebug('tick', history[history.length - 1]); }, 1000);

// ---------------- test hooks ----------------
var FM = window.FM = {
  get state() { return state; }, get outcome() { return outcome; }, get spinNo() { return spinNo; }, get balance() { return balance; },
  get shownWin() { return shownWin; }, get shownBal() { return shownBal; }, get heat() { return heat.slice(); }, get fps() { return fps; },
  get shownGrid() { return shownGrid.map(function (c) { return c.slice(); }); }, history: history, seed: SEED, bonusShown: null,
  layout: function () { return { K: K, OX: OX, OY: OY, Lh: Lh, reelTop: reelTop, cellH: cellH, colW: colW, x0: x0, gap: gap, smithH: smithH, furnace: furnaceC(), smiths: [0, 1, 2, 3].map(function (i) { var b = smithBase(i), s = C.smith[i]; return { x: b.x, y: b.y - s.h * 0.5 }; }) }; },
  toScreen: function (x, y) { return { x: OX + x * K, y: OY + y * K }; },
  get armed() { return { ms: armedMs.slice(), bonus: armedBonus }; }
};

// ---------------- boot ----------------
var LIST = ['bg', 'smith_0', 'smith_1', 'smith_2', 'smith_3'].concat(SYMN.map(function (n) { return 'sym_' + n; }));
Promise.all(LIST.map(function (n) { return new Promise(function (res, rej) { var im = new Image(); im.onload = function () { IMG[n] = im; res(); }; im.onerror = function () { rej(new Error('asset ' + n)); }; im.src = 'assets/' + n + '.webp'; }); })
  .concat([document.fonts && document.fonts.load ? document.fonts.load('30px Lilita').catch(function () {}) : Promise.resolve()]))
  .then(function () {
    layout(); state = 'idle';
    var ld = document.getElementById('load'); if (ld) ld.remove();
    updateDebug('boot');
    requestAnimationFrame(frame);
  });
})();

</script>
