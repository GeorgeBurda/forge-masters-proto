  layout: function () { return { K: K, OX: OX, OY: OY, Lh: Lh, reelTop: reelTop, cellH: cellH, colW: colW, x0: x0, gap: gap, smithH: smithH, furnace: furnaceC(), drums: [0, 1, 2, 3].map(function (i) { var t = drumTop(i); return { x: t.x, y: t.y + C.drum[i].h * 0.45 }; }), smiths: [0, 1, 2, 3].map(function (i) { var b = smithBase(i), s = C.smith[i]; return { x: b.x, y: b.y - s.h * 0.5 }; }) }; },
  toScreen: function (x, y) { return { x: OX + x * K, y: OY + y * K }; },
  get armed() { return { ms: armedMs.slice(), bonus: armedBonus }; },
  tap: function (x, y) { onTap(x == null ? { clientX: -1e4, clientY: -1e4 } : { clientX: x, clientY: y }); },
  get dpr() { return DPR; },
  _heat: function (v) { for (var r = 0; r < R; r++) heat[r] = v; lastActive = now + 3000; }
};

// ---------------- boot ----------------
var LIST = ['bg', 'smith_0', 'smith_1', 'smith_2', 'smith_3', 'drum_0', 'drum_1', 'drum_2', 'drum_3'].concat(SYMN.map(function (n) { return 'sym_' + n; }));
Promise.all(LIST.map(function (n) { return new Promise(function (res, rej) { var im = new Image(); im.onload = function () { IMG[n] = im; res(); }; im.onerror = function () { rej(new Error('asset ' + n)); }; im.src = 'assets/bz_' + n + '.webp'; }); })
  .concat([document.fonts && document.fonts.load ? Promise.all([document.fonts.load('30px Lilita'), document.fonts.load('30px Aladin')]).catch(function () {}) : Promise.resolve()]))
  .then(function () {
    layout(); state = 'idle';
    var ld = document.getElementById('load'); if (ld) ld.remove();
    updateDebug('boot');
    requestAnimationFrame(frame);
  });
})();
